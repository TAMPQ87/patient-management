<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý bệnh nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body { padding-top: 20px; background-color: #f1f3f5; }
        .container { max-width: 1400px; }
        #patientTable { width: 100% !important; }
        .tab-content { padding: 20px 0; }
        .card { margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .card-header { background-color: #e9ecef; font-weight: bold; border-bottom: 1px solid #dee2e6; }
        .card-body { background-color: #ffffff; padding: 20px; }
        .form-check-inline { margin-right: 20px; }
        .action-buttons { display: flex; gap: 5px; }
        .action-buttons .btn { padding: 5px 10px; font-size: 14px; }
        .modal-body { max-height: 70vh; overflow-y: auto; }
        .form-label { font-weight: bold; }
        .status-upcoming { background-color: #fff3cd; } /* Vàng */
        .status-due { background-color: #d4edda; } /* Xanh lá */
        .status-overdue { background-color: #f8d7da; } /* Đỏ */
        .status-normal { background-color: #e9ecef; } /* Xám */
        .status-none { background-color: #f1f3f5; } /* Xám nhạt */
        .alert-container { margin-bottom: 20px; }
        .btn-action-group { text-align: center; margin-top: 20px; }
        .btn-action-group .btn { margin: 0 10px; padding: 10px 20px; font-size: 16px; }
        .pagination-container { margin-top: 20px; text-align: center; }
        .pagination-container .page-item { cursor: pointer; }
        @media (max-width: 768px) {
            .form-check-inline { margin-bottom: 10px; }
            .btn-action-group .btn { width: 100%; margin: 5px 0; }
            .card-body { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="alert-container"></div>
        <h1 class="mb-4 text-center">Quản lý bệnh nhân</h1>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="patient-tab" data-bs-toggle="tab" data-bs-target="#patient-pane" type="button" role="tab" aria-controls="patient-pane" aria-selected="true">Danh sách bệnh nhân</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="report-tab" data-bs-toggle="tab" data-bs-target="#report-pane" type="button" role="tab" aria-controls="report-pane" aria-selected="false">Tạo báo cáo</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Tab Danh sách bệnh nhân -->
            <div class="tab-pane fade show active" id="patient-pane" role="tabpanel" aria-labelledby="patient-tab">
                <div class="d-flex gap-2 mb-3">
                    <button id="addPatientBtn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#patientModal">Thêm bệnh nhân</button>
                    <input type="file" id="uploadExcel" accept=".xlsx" class="form-control" style="width: auto;">
                    <button id="importExcelBtn" class="btn btn-primary">Nhập từ Excel</button>
                </div>
                <div id="reportSummary" class="mb-3"></div>
                <table id="patientTable" class="table table-striped">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Họ và Tên</th>
                            <th>Năm sinh</th>
                            <th>Giới tính</th>
                            <th>Nhà</th>
                            <th>Thuốc</th>
                            <th>Ngày khám</th>
                            <th>Ngày tái khám</th>
                            <th>Trạng thái</th>
                            <th>Khu vực</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="pagination" class="pagination-container"></div>
            </div>

            <!-- Tab Tạo báo cáo -->
            <div class="tab-pane fade" id="report-pane" role="tabpanel" aria-labelledby="report-tab">
                <!-- Card Lọc theo khu vực -->
                <div class="card">
                    <div class="card-header">Lọc theo khu vực</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="areaFilter" class="form-label">Khu vực:</label>
                                <select id="areaFilter" class="form-select">
                                    <option value="all">Tất cả</option>
                                    <option value="Khu I">Khu I</option>
                                    <option value="Khu II">Khu II</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card Lọc theo thời gian -->
                <div class="card">
                    <div class="card-header">Lọc theo thời gian</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="reportDate" class="form-label">Ngày bắt đầu:</label>
                                <input type="text" id="reportDate" name="reportDate" class="form-control" placeholder="dd/mm/yyyy">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="endDate" class="form-label">Ngày kết thúc:</label>
                                <input type="text" id="endDate" name="endDate" class="form-control" placeholder="dd/mm/yyyy">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="reportType" class="form-label">Kỳ báo cáo:</label>
                                <select id="reportType" name="reportType" class="form-select">
                                    <option value="day">Ngày chọn</option>
                                    <option value="week">Tuần</option>
                                    <option value="month">Tháng</option>
                                    <option value="year">Năm</option>
                                    <option value="range">Khoảng thời gian</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card Lọc theo trạng thái -->
                <div class="card">
                    <div class="card-header">Lọc theo trạng thái</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Trạng thái tái khám:</label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input status-checkbox" type="checkbox" value="upcoming" id="statusUpcoming" checked>
                                        <label class="form-check-label" for="statusUpcoming">Sắp đến</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input status-checkbox" type="checkbox" value="due" id="statusDue" checked>
                                        <label class="form-check-label" for="statusDue">Hôm nay</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input status-checkbox" type="checkbox" value="overdue" id="statusOverdue" checked>
                                        <label class="form-check-label" for="statusOverdue">Quá hạn</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input status-checkbox" type="checkbox" value="normal" id="statusNormal" checked>
                                        <label class="form-check-label" for="statusNormal">Bình thường</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="warningDays" class="form-label">Ngưỡng cảnh báo (ngày):</label>
                                <input type="number" id="warningDays" class="form-control" value="7" min="0" max="30">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card Nút hành động -->
                <div class="card">
                    <div class="card-body btn-action-group">
                        <button id="generateReportBtn" class="btn btn-primary">Tạo báo cáo</button>
                        <button id="exportReportBtn" class="btn btn-success">Xuất Excel</button>
                        <button id="resetFilterBtn" class="btn btn-secondary">Reset bộ lọc</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal nhập liệu -->
        <div class="modal fade" id="patientModal" tabindex="-1" aria-labelledby="patientModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="patientModalLabel">Thêm bệnh nhân mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="patientForm">
                            <input type="hidden" id="originalId">
                            <div class="mb-3">
                                <label for="id" class="form-label">STT</label>
                                <input type="number" class="form-control" id="id" required>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Họ và Tên</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="year" class="form-label">Năm sinh</label>
                                <input type="number" class="form-control" id="year" required min="1900" max="2025">
                            </div>
                            <div class="mb-3">
                                <label for="gender" class="form-label">Giới tính</label>
                                <select class="form-select" id="gender" required>
                                    <option value="">Chọn giới tính</option>
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="house" class="form-label">Nhà</label>
                                <input type="text" class="form-control" id="house">
                            </div>
                            <div class="mb-3">
                                <label for="medication" class="form-label">Thuốc</label>
                                <input type="text" class="form-control" id="medication">
                            </div>
                            <div class="mb-3">
                                <label for="examDate" class="form-label">Ngày khám</label>
                                <input type="text" class="form-control" id="examDate" placeholder="dd/mm/yyyy">
                            </div>
                            <div class="mb-3">
                                <label for="reExamDate" class="form-label">Ngày tái khám</label>
                                <input type="text" class="form-control" id="reExamDate" placeholder="dd/mm/yyyy">
                            </div>
                            <div class="mb-3">
                                <label for="area" class="form-label">Phân khu</label>
                                <select class="form-select" id="area" required>
                                    <option value="">Chọn khu</option>
                                    <option value="I">Khu I</option>
                                    <option value="II">Khu II</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Lưu bệnh nhân</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/min/moment.min.js"></script>
        <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://npmcdn.com/flatpickr@4.6.13/dist/l10n/vn.js"></script>
        <script src="script.js"></script>
    </body>
</html>
