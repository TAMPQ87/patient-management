<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bệnh nhân huyết áp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.9/dist/flatpickr.min.css" rel="stylesheet">
    <style>
        .status-overdue { background-color: #ff4d4d; color: #ffffff; font-weight: bold; }
        .status-due { background-color: #28a745; color: #ffffff; font-weight: bold; }
        .status-upcoming { background-color: #ff9800; color: #ffffff; font-weight: bold; }
        .status-none { background-color: #b0b0b0; color: #ffffff; font-weight: bold; }
        .action-buttons { display: flex; gap: 5px; }
        .table th, .table td { vertical-align: middle; }
        .filter-section { margin-bottom: 20px; }
        .modal-body .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Quản lý bệnh nhân huyết áp</h1>
        <div class="filter-section">
            <div class="row">
                <div class="col-md-3">
                    <label for="areaFilter" class="form-label">Phân khu</label>
                    <select id="areaFilter" class="form-select">
                        <option value="all">Tất cả</option>
                        <option value="I">Khu I</option>
                        <option value="II">Khu II</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="reportDate" class="form-label">Ngày bắt đầu</label>
                    <input type="text" id="reportDate" class="form-control" placeholder="dd/mm/yyyy">
                </div>
                <div class="col-md-3">
                    <label for="endDate" class="form-label">Ngày kết thúc</label>
                    <input type="text" id="endDate" class="form-control" placeholder="dd/mm/yyyy">
                </div>
                <div class="col-md-3">
                    <label for="reportType" class="form-label">Kiểu báo cáo</label>
                    <select id="reportType" class="form-select">
                        <option value="day">Ngày</option>
                        <option value="week">Tuần</option>
                        <option value="month">Tháng</option>
                        <option value="year">Năm</option>
                        <option value="range">Khoảng thời gian</option>
                    </select>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-3">
                    <label for="statusFilter" class="form-label">Trạng thái tái khám</label>
                    <select id="statusFilter" class="form-select">
                        <option value="all">Tất cả</option>
                        <option value="overdue">Quá hạn</option>
                        <option value="due">Hôm nay</option>
                        <option value="upcoming">Sắp đến</option>
                        <option value="none">Không có ngày</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="warningDays" class="form-label">Ngưỡng cảnh báo (ngày)</label>
                    <input type="number" id="warningDays" class="form-control" value="7" min="1">
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <button id="generateReportBtn" class="btn btn-primary me-2">Tạo báo cáo</button>
                    <button id="exportReportBtn" class="btn btn-success">Xuất Excel</button>
                    <button id="addPatientBtn" class="btn btn-info ms-2" data-bs-toggle="modal" data-bs-target="#patientModal">Thêm bệnh nhân</button>
                </div>
            </div>
        </div>
        <table id="patientTable" class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ và Tên</th>
                    <th>Năm sinh</th>
                    <th>Giới tính</th>
                    <th>Nhà</th>
                    <th>Thuốc</th>
                    <th>Ngày khám</th>
                    <th>Ngày tái khám</th>
                    <th>Trạng thái tái khám</th>
                    <th>Khu vực</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Modal nhập liệu -->
    <div class="modal fade" id="patientModal" tabindex="-1" aria-labelledby="patientModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="patientModalLabel">Thêm bệnh nhân mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="patientForm">
                        <input type="hidden" id="originalId">
                        <div class="form-group">
                            <label for="id">STT</label>
                            <input type="number" class="form-control" id="id" required>
                        </div>
                        <div class="form-group">
                            <label for="name">Họ và Tên</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="form-group">
                            <label for="year">Năm sinh</label>
                            <input type="number" class="form-control" id="year" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Giới tính</label>
                            <select class="form-control" id="gender" required>
                                <option value="">Chọn giới tính</option>
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="house">Nhà</label>
                            <input type="text" class="form-control" id="house">
                        </div>
                        <div class="form-group">
                            <label for="medication">Thuốc</label>
                            <input type="text" class="form-control" id="medication">
                        </div>
                        <div class="form-group">
                            <label for="examDate">Ngày khám</label>
                            <input type="text" class="form-control" id="examDate">
                        </div>
                        <div class="form-group">
                            <label for="reExamDate">Ngày tái khám</label>
                            <input type="text" class="form-control" id="reExamDate">
                        </div>
                        <div class="form-group">
                            <label for="area">Phân khu</label>
                            <select class="form-control" id="area" required>
                                <option value="">Chọn khu</option>
                                <option value="I">Khu I</option>
                                <option value="II">Khu II</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.9/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.9/dist/l10n/vn.js"></script>
    <script src="script.js"></script>
</body>
</html>
